name: Bug report
description: Something is not working as documented.
labels: ["bug"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - Forms (REST submissions)
        - Push (Expo notifications)
        - Plugin core (menu, modules, updates)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: From MrDemonWolf → General.
      placeholder: "1.4.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: WordPress and PHP versions
      placeholder: "WordPress 7.1, PHP 8.3"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include any error message in full. Never paste an Expo access token or App Check token.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
