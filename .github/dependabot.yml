version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "composer"
    directory: "/apps/plugin"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # apps/plugin is deliberately on Tailwind 3: its scoped admin stylesheet
      # depends on the v3 JavaScript config (prefix, important, preflight: false)
      # to avoid leaking into wp-admin. One npm config covers the whole Bun
      # workspace, so this also holds back major Tailwind bumps for apps/docs;
      # minor and patch updates still come through for both.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
